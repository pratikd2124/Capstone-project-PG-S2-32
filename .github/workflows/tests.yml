name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
        # The tests pull RYA's baseline code and model files from the Baseline-Recreation branch
        # (integrated_pipeline/baseline.py). Most run on a small synthetic project; one checks the
        # real EXP002 against RYA's simulator.
